<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT-Style Shimmer Text</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #202123;
    }

    .demo {
      width: min(760px, calc(100vw - 40px));
      padding: 32px;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .label {
      margin-bottom: 18px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8a8f98;
    }

    /* ChatGPT-style shimmer text */
    .shimmer-text {
      display: inline-block;
      font-size: 28px;
      line-height: 1.35;
      font-weight: 500;
      letter-spacing: -0.02em;

      /* Base text color */
      color: #6b7280;

      /* Moving highlight */
      background-image: linear-gradient(
        100deg,
        #6b7280 0%,
        #6b7280 38%,
        #d9dde3 47%,
        #ffffff 50%,
        #d9dde3 53%,
        #6b7280 62%,
        #6b7280 100%
      );
      background-size: 250% 100%;
      background-position: 200% center;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 2.2s linear infinite;
    }

    @keyframes shimmer {
      from {
        background-position: 200% center;
      }
      to {
        background-position: -50% center;
      }
    }

    /* Optional darker version for dark mode testing */
    .dark {
      margin-top: 34px;
      padding: 28px;
      border-radius: 14px;
      background: #1f2023;
    }

    .dark .label {
      color: #9ca3af;
    }

    .dark .shimmer-text {
      background-image: linear-gradient(
        100deg,
        #a7adb7 0%,
        #a7adb7 38%,
        #e5e7eb 47%,
        #ffffff 50%,
        #e5e7eb 53%,
        #a7adb7 62%,
        #a7adb7 100%
      );
    }

    @media (prefers-reduced-motion: reduce) {
      .shimmer-text {
        animation: none;
        background-image: none;
        color: #6b7280;
        -webkit-text-fill-color: currentColor;
      }
    }
  </style>
</head>
<body>
  <main class="demo">
    <div class="label">Light mode</div>
    <div class="shimmer-text">Thinking and generating your response...</div>

    <section class="dark">
      <div class="label">Dark mode</div>
      <div class="shimmer-text">Thinking and generating your response...</div>
    </section>
  </main>
</body>
</html>
