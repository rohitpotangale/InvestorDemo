<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Insights · InvestorLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  /* ---------- Theme tokens ---------- */
  :root, [data-theme="dark"]{
    --bg: rgb(15,23,42);
    --panel: rgb(12,19,36);
    --card: rgb(22,32,55);
    --card-hover: rgb(27,39,66);
    --inset: rgb(15,23,42);
    --line: rgb(40,53,80);
    --line-soft: rgb(30,42,66);
    --text: #e8edf6;
    --muted: #9aa8c1;
    --faint: #6b7a96;
    --btn-primary-bg: #f1f5f9;
    --btn-primary-fg: rgb(15,23,42);
    --chip-on-bg: #f1f5f9;
    --chip-on-fg: rgb(15,23,42);
    --topbar: rgba(15,23,42,.82);
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.55);
    --shadow-hover: 0 1px 0 rgba(255,255,255,.05) inset, 0 16px 32px -14px rgba(0,0,0,.7);
    --fin:#4fd1b0; --ops:#7ea6ff; --risk:#f27c94; --comp:#e8bb5e; --mkt:#ab92fb;
    --focus:#7ea6ff;
  }
  [data-theme="light"]{
    --bg: #f3f4f6;
    --panel: #ffffff;
    --card: #ffffff;
    --card-hover: #fafafa;
    --inset: #f3f4f6;
    --line: #e5e7eb;
    --line-soft: #eceef1;
    --text: #111827;
    --muted: #6b7280;
    --faint: #9ca3af;
    --btn-primary-bg: #111827;
    --btn-primary-fg: #ffffff;
    --chip-on-bg: #111827;
    --chip-on-fg: #ffffff;
    --topbar: rgba(243,244,246,.85);
    --shadow: 0 1px 2px rgba(17,24,39,.05);
    --shadow-hover: 0 12px 28px -14px rgba(17,24,39,.22);
    --fin:#0f9f7e; --ops:#3b66d6; --risk:#d6395b; --comp:#b7791f; --mkt:#7c4fe0;
    --focus:#3b66d6;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:'Instrument Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  body{transition:background .25s,color .25s}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  svg{display:block;flex:none}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}

  .app{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:100vh}
  main{min-width:0}
  .wrap{padding:32px 44px 64px;max-width:1240px}

  /* ---------- Top bar ---------- */
  .topbar{position:sticky;top:0;z-index:5;background:var(--topbar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft);padding:14px 44px;display:flex;align-items:center;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;margin-right:12px}
  .tabs{display:flex;gap:4px;margin-right:auto;align-self:stretch;align-items:stretch}
  .tab{display:flex;align-items:center;padding:0 12px;color:var(--muted);font-weight:500;text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-15px;padding-bottom:1px;transition:color .15s}
  .tab:hover{color:var(--text)}
  .tab[aria-current="page"]{color:var(--text);border-bottom-color:var(--text)}
  .logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ops),var(--mkt));color:#fff}
  .crumb{color:var(--faint);font-weight:400}
  .search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 10px 0 12px;height:38px;width:320px;color:var(--muted);box-shadow:var(--shadow);transition:border-color .15s}
  .search:focus-within{border-color:var(--focus)}
  .search input{background:none;border:0;outline:0;color:var(--text);font:inherit;width:100%}
  .search input::placeholder{color:var(--faint)}
  .kbd{font-size:11.5px;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:20px}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted);box-shadow:var(--shadow);transition:color .15s,border-color .15s}
  .icon-btn:hover{color:var(--text);border-color:var(--faint)}
  [data-theme="dark"] .i-moon{display:none} [data-theme="light"] .i-sun{display:none}

  .btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s;box-shadow:var(--shadow)}
  .btn:hover{background:var(--card-hover);border-color:var(--faint)}
  .btn.primary{background:var(--btn-primary-bg);color:var(--btn-primary-fg);border-color:transparent;font-weight:500}
  .btn.primary:hover{opacity:.9}
  .btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px;box-shadow:none}

  /* ---------- Page header ---------- */
  .head{padding:34px 0 22px}
  .head h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:46px;line-height:1.05;letter-spacing:-.01em}
  .head p{color:var(--muted);margin-top:8px;max-width:52ch}

  .filters{display:flex;gap:6px;margin-bottom:30px;flex-wrap:wrap;align-items:center}
  .chip-f{height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
  .chip-f i{width:7px;height:7px;border-radius:50%;background:var(--c)}
  .chip-f:hover{color:var(--text);border-color:var(--faint)}
  .chip-f[aria-pressed="true"]{background:var(--chip-on-bg);color:var(--chip-on-fg);border-color:transparent;font-weight:500}

  /* ---------- Sections ---------- */
  section{margin-bottom:42px}
  .sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .sec-h h2{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
  .sec-h h2 svg{color:var(--faint)}
  .sec-h span,.sec-h button{color:var(--faint);font-size:13px}
  .sec-h button:hover{color:var(--text)}
  .count{background:var(--inset);border:1px solid var(--line-soft);border-radius:999px;padding:0 8px;font-size:12px;color:var(--muted)}

  /* ---------- Widget cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
  .card{--c:var(--ops);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:background .15s,border-color .15s,transform .18s,box-shadow .18s}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c);opacity:.85}
  .card:hover{background:var(--card-hover);transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
  .card-top{display:flex;align-items:center;justify-content:space-between}
  .cat{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.04em;padding:3px 10px 3px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 32%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent)}
  .cat i{width:6px;height:6px;border-radius:50%;background:var(--c)}
  .pin{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--faint);transition:all .15s;position:relative;z-index:1}
  .pin:hover{background:var(--inset);color:var(--text)}
  .pin[aria-pressed="true"]{color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
  .pin[aria-pressed="true"] svg{fill:currentColor}
  .card h3{font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.005em}
  .spark{height:40px;width:100%}
  .meta{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line-soft);color:var(--muted);font-size:13px}
  .meta div{display:flex;align-items:center;gap:8px;min-width:0}
  .meta svg{color:var(--faint)}
  .meta b{font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .open{position:absolute;inset:0}
  .go{position:absolute;right:14px;bottom:14px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;opacity:0;transform:translateX(-4px);transition:all .18s;pointer-events:none}
  .card:hover .go{opacity:1;transform:none}

  .rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(285px,310px);gap:16px;overflow-x:auto;padding:2px 2px 14px;scroll-snap-type:x proximity}
  .rail .card{scroll-snap-align:start}
  .rail::-webkit-scrollbar{height:6px}
  .rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

  /* ---------- Lists ---------- */
  .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
  .list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .list-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line-soft)}
  .list-h h2{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
  .list-h h2 svg{color:var(--faint)}
  .row{--c:var(--ops);display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line-soft);transition:background .15s}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--card-hover)}
  .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
  .row h4{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row small{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--c)}
  .acts{display:flex;gap:6px}
  .btn.rerun[data-state="running"]{color:var(--fin);border-color:color-mix(in srgb,var(--fin) 45%,transparent)}
  .spin{display:block;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Sessions panel ---------- */
  aside{border-left:1px solid var(--line-soft);background:var(--panel);padding:22px 18px 28px;position:sticky;top:0;height:100vh;overflow:auto}
  .s-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 4px}
  .s-h h2{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
  .s-h h2 svg{color:var(--faint)}
  .s-search{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:10px;background:var(--inset);border:1px solid var(--line-soft);color:var(--muted);margin-bottom:6px}
  .s-search:focus-within{border-color:var(--focus)}
  .s-search input{background:none;border:0;outline:0;color:var(--text);font:inherit;width:100%}
  .s-search input::placeholder{color:var(--faint)}
  .grp{color:var(--faint);font-size:12.5px;font-weight:500;margin:20px 0 6px 10px}
  .sess{position:relative;display:flex;align-items:center;gap:8px;width:100%;padding:9px 6px 9px 10px;border-radius:10px;transition:background .15s;cursor:pointer}
  .sess:hover,.sess.open{background:var(--inset)}
  .sess[aria-current="true"]{background:var(--inset);box-shadow:0 0 0 1px var(--line-soft) inset}
  .s-main{min-width:0;flex:1}
  .sess p{font-size:13.5px;line-height:1.35;color:var(--text)}
  .sess small{color:var(--faint);font-size:12px}
  .dots{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);opacity:0;transition:opacity .15s,background .15s}
  .sess:hover .dots,.sess:focus-within .dots,.sess.open .dots,.dots:focus-visible{opacity:1}
  .dots:hover{background:var(--line-soft);color:var(--text)}
  @media (hover:none){.dots{opacity:1}}
  .rename{width:100%;background:var(--card);border:1px solid var(--focus);border-radius:7px;color:var(--text);font:inherit;font-size:13.5px;padding:3px 8px;outline:0}
  .menu{position:fixed;z-index:20;min-width:172px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-hover)}
  .menu[hidden]{display:none}
  .menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:13.5px;text-align:left}
  .menu button:hover,.menu button:focus-visible{background:var(--inset)}
  .menu button svg{color:var(--muted)}
  .menu hr{border:0;border-top:1px solid var(--line-soft);margin:4px 2px}
  .menu .danger,.menu .danger svg{color:var(--risk)}
  .s-foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line-soft)}
  .s-foot button{color:var(--muted);font-size:13px;padding:0 10px}
  .s-foot button:hover{color:var(--text)}
  .empty{color:var(--muted);padding:20px;font-size:13.5px;border:1px dashed var(--line);border-radius:14px;grid-column:1/-1}
  .s-empty{display:none}

  @media (max-width:1180px){
    .app{grid-template-columns:1fr}
    aside{position:static;height:auto;border-left:0;border-top:1px solid var(--line-soft)}
  }
  @media (max-width:860px){
    .topbar{padding:12px 16px;flex-wrap:wrap}
    .search{width:100%;order:5}
    .wrap{padding:0 16px 40px}
    .two{grid-template-columns:1fr}
    .head h1{font-size:36px}
    .btn.primary span{display:none}
    .btn.primary{padding:0 11px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <main>
    <div class="topbar">
      <div class="brand">
        <div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 9 12l4 3 7-9"/></svg></div>
        <span>InvestorLens</span>
      </div>
      <nav class="tabs" aria-label="Primary">
        <a class="tab" href="#" aria-current="page">My Insights</a>
      </nav>
      <label class="search" aria-label="Search insights">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search widgets, views, datasets">
        <span class="kbd">/</span>
      </label>
      <button class="icon-btn" id="theme" aria-label="Switch theme" title="Switch theme">
        <svg class="i-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
      </button>
      <button class="btn primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>New insight</span>
      </button>
    </div>

    <div class="wrap">
      <section>
        <div class="sec-h">
          <h2><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6Z"/><path d="M12 14v7"/></svg>Pinned widgets <span class="count" id="pinCount"></span></h2>
        </div>
        <div class="grid" id="pinned"></div>
      </section>

      <section>
        <div class="sec-h">
          <h2><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Recently viewed</h2>
          <button>View all history</button>
        </div>
        <div class="rail" id="recent"></div>
      </section>

      <div class="two">
        <div class="list">
          <div class="list-h"><h2><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg>Saved views <span class="count" id="savedCount"></span></h2></div>
          <div id="saved"></div>
        </div>
        <div class="list">
          <div class="list-h"><h2><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.2-5.5 6.5-5.5s5.9 2 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c2 .6 3.2 2.3 3.5 5"/></svg>Shared with me <span class="count" id="sharedCount"></span></h2></div>
          <div id="shared"></div>
        </div>
      </div>
    </div>
  </main>

  <aside aria-label="Sessions">
    <div class="s-h">
      <h2><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5Z"/></svg>Sessions</h2>
      <button class="btn sm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New
      </button>
    </div>
    <label class="s-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="sq" type="search" placeholder="Search sessions">
    </label>
    <div id="sessions"></div>
    <p class="empty s-empty" id="sEmpty">No sessions match that search.</p>
    <div class="s-foot"><button>See all sessions</button></div>
  </aside>
</div>

<script>
const COLORS = {FIN:'var(--fin)',OPS:'var(--ops)',RISK:'var(--risk)',COMP:'var(--comp)',MKT:'var(--mkt)'};
const DS = 'Investor cross product';

const I = {
  pin:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6Z"/><path d="M12 14v7"/></svg>',
  clock:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  db:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>',
  rerun:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>',
  arrow:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>',
  chart:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4M4 20h16M8 15l4-5 3 3 5-7"/></svg>',
  table:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 10h17M9.5 10v9.5"/></svg>',
  pie:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9h9"/><path d="M20.5 15A9 9 0 1 1 9 3.5"/></svg>',
  shield:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6l-7-3Z"/></svg>',
  flow:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="6" height="5" rx="1.5"/><rect x="15" y="15.5" width="6" height="5" rx="1.5"/><path d="M6 8.5v4a3 3 0 0 0 3 3h6"/></svg>'
};

const widgets = [
  {id:1,cat:'FIN', title:'Client billing analysis', last:'Today, 9:42 AM',  pinned:true, pts:[8,9,7,11,12,10,14,15,13,17]},
  {id:2,cat:'RISK',title:'Exposure concentration by sector', last:'Today, 8:15 AM',  pinned:true, pts:[14,13,15,12,11,13,9,10,8,9]},
  {id:3,cat:'OPS', title:'Onboarding turnaround time', last:'Yesterday, 4:30 PM', pinned:true, pts:[10,12,11,9,10,8,9,7,8,6]},
  {id:4,cat:'FIN', title:'Fee leakage by product line', last:'Oct 26, 11:05 AM', pinned:true, pts:[6,7,7,9,8,10,9,12,11,12]},
  {id:5,cat:'COMP',title:'Mandate breach watchlist', last:'Oct 25, 2:20 PM', pinned:true, pts:[5,5,6,5,8,7,6,9,8,7]},
  {id:6,cat:'MKT', title:'Cross-sell uptake by segment', last:'Oct 24, 10:10 AM', pinned:true, pts:[7,8,10,9,12,11,13,12,15,16]},
  {id:7,cat:'RISK',title:'Liquidity stress scenarios', last:'Today, 10:05 AM', pinned:false, pts:[9,10,8,11,9,12,10,9,11,10]},
  {id:8,cat:'OPS', title:'Reconciliation breaks, week 43', last:'Today, 7:50 AM', pinned:false, pts:[12,10,11,9,8,9,7,6,7,5]}
];
const recentIds = [7,1,8,2,3];

const saved = [
  {t:'Quarterly fee review, all products', s:'Last opened Oct 27, 6:12 PM', cat:'FIN', icon:'chart'},
  {t:'High-risk accounts, top 50', s:'Last opened Oct 27, 11:40 AM', cat:'RISK', icon:'shield'},
  {t:'Month-end close checklist status', s:'Last opened Oct 24, 5:02 PM', cat:'OPS', icon:'flow'},
  {t:'Segment performance vs. benchmark', s:'Last opened Oct 22, 9:30 AM', cat:'MKT', icon:'pie'},
  {t:'Advisory revenue by region', s:'Last opened Oct 20, 3:45 PM', cat:'FIN', icon:'table'}
];
const shared = [
  {t:'Client profitability ranking', s:'Priya S. · Oct 28, 8:05 AM', cat:'FIN', icon:'chart'},
  {t:'Counterparty limit utilisation', s:'Daniel M. · Oct 27, 3:20 PM', cat:'RISK', icon:'shield'},
  {t:'Settlement delays, root causes', s:'Ananya R. · Oct 25, 1:10 PM', cat:'OPS', icon:'flow'},
  {t:'Regulatory filing tracker', s:'Marcus L. · Oct 23, 10:55 AM', cat:'COMP', icon:'table'}
];

const sessions = [
  {id:1,g:'Today', t:'Why did billing drop for Client A in Q3?', time:'9:42 AM', cur:true},
  {id:2,g:'Today', t:'Compare fee leakage across product lines', time:'8:20 AM'},
  {id:3,g:'Today', t:'Stress test liquidity under a rate shock', time:'7:55 AM'},
  {id:4,g:'Yesterday', t:'Onboarding delays by region', time:'4:30 PM'},
  {id:5,g:'Yesterday', t:'Top 10 clients by net revenue', time:'11:12 AM'},
  {id:6,g:'Yesterday', t:'Mandate breaches since September', time:'9:03 AM'},
  {id:7,g:'Earlier this week', t:'Cross-sell opportunities in wealth segment', time:'Mon'},
  {id:8,g:'Earlier this week', t:'Reconciliation breaks, root cause summary', time:'Mon'}
];
let renamingId = null;
const SI = {
  dots:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  pin:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6Z"/><path d="M12 14v7"/></svg>',
  edit:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>',
  trash:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'
};

let activeCat = 'ALL';
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function spark(pts, color, id){
  const w=240,h=40,max=Math.max(...pts),min=Math.min(...pts);
  const xy = pts.map((p,i)=>[(i/(pts.length-1))*w, h-5-((p-min)/(max-min||1))*(h-10)]);
  const d = xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last = xy[xy.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#g${id})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

let uid = 0;
function card(w){
  const c = COLORS[w.cat];
  return `<article class="card" style="--c:${c}">
    <div class="card-top">
      <span class="cat"><i></i>${w.cat}</span>
      <button class="pin" data-pin="${w.id}" aria-pressed="${w.pinned}" aria-label="${w.pinned?'Unpin':'Pin'} ${esc(w.title)}" title="${w.pinned?'Unpin':'Pin to top'}">${I.pin}</button>
    </div>
    <h3>${esc(w.title)}</h3>
    <div class="meta">
      <div>${I.clock}<span>Last viewed&nbsp;<b>${w.last}</b></span></div>
      <div>${I.db}<span>Dataset&nbsp;<b>${DS}</b></span></div>
    </div>
    <a class="open" href="#" aria-label="Open ${esc(w.title)}"></a>
    <span class="go">${I.arrow}</span>
  </article>`;
}

function rows(list){
  return list.map(r=>`<div class="row" style="--c:${COLORS[r.cat]}">
    <div class="ico">${I[r.icon]}</div>
    <div><h4>${esc(r.t)}</h4><small><span class="tag">${r.cat}</span>${esc(r.s)}</small></div>
    <div class="acts">
      <button class="btn sm rerun" data-rerun aria-label="Rerun ${esc(r.t)}">${I.rerun}Rerun</button>
      <button class="btn sm">Open</button>
    </div></div>`).join('');
}

function render(){
  uid = 0;
  const q = $('#q').value.trim().toLowerCase();
  const match = x => (activeCat==='ALL'||x.cat===activeCat) && (!q || (x.title||x.t).toLowerCase().includes(q));
  const pinned = widgets.filter(w=>w.pinned && match(w));
  $('#pinned').innerHTML = pinned.length ? pinned.map(card).join('') : '<p class="empty">No pinned widgets match. Pin one from Recently viewed.</p>';
  $('#pinCount').textContent = widgets.filter(w=>w.pinned).length;
  const rec = recentIds.map(id=>widgets.find(w=>w.id===id)).filter(match);
  $('#recent').innerHTML = rec.length ? rec.map(card).join('') : '<p class="empty">Nothing viewed recently in this category.</p>';
  const s = saved.filter(match), sh = shared.filter(match);
  $('#saved').innerHTML = s.length ? rows(s) : '<p class="empty" style="margin:14px">No saved views here yet.</p>';
  $('#shared').innerHTML = sh.length ? rows(sh) : '<p class="empty" style="margin:14px">Nothing shared with you in this category.</p>';
  $('#savedCount').textContent = saved.length;
  $('#sharedCount').textContent = shared.length;
}

function renderFilters(){
  $('#filters').innerHTML = ['ALL','FIN','OPS','RISK','COMP','MKT'].map(c=>
    `<button class="chip-f" data-cat="${c}" aria-pressed="${c===activeCat}">${c==='ALL'?'All':`<i style="--c:${COLORS[c]}"></i>${c}`}</button>`).join('');
}

function renderSessions(){
  const q = $('#sq').value.trim().toLowerCase();
  const list = sessions.filter(s=>!q||s.t.toLowerCase().includes(q));
  const item = s => `<div class="sess" data-sid="${s.id}" ${s.cur?'aria-current="true"':''}>
      <div class="s-main">${renamingId===s.id ? `<input class="rename" value="${esc(s.t)}" aria-label="Rename session">` : `<p>${esc(s.t)}</p>`}<small>${s.time}</small></div>
      <button class="dots" data-menu="${s.id}" aria-label="Session options" aria-haspopup="menu">${SI.dots}</button></div>`;
  const pinned = list.filter(s=>s.pinned), rest = list.filter(s=>!s.pinned);
  let html = pinned.length ? '<div class="grp">Pinned</div>'+pinned.map(item).join('') : '', g='';
  rest.forEach(s=>{
    if(s.g!==g){g=s.g;html+=`<div class="grp">${s.g}</div>`}
    html+=item(s);
  });
  $('#sessions').innerHTML = html;
  $('#sEmpty').style.display = list.length?'none':'block';
  const inp = $('#sessions .rename'); if(inp){inp.focus();inp.select()}
}

/* session menu */
const menu = document.createElement('div');
menu.className='menu'; menu.setAttribute('role','menu'); menu.hidden=true;
document.body.appendChild(menu);
function closeMenu(){
  menu.hidden=true;
  document.querySelectorAll('.sess.open').forEach(x=>x.classList.remove('open'));
}
function openMenu(btn,id){
  const s = sessions.find(x=>x.id===id);
  menu.dataset.sid = id;
  menu.innerHTML = `<button role="menuitem" data-act="pin">${SI.pin}${s.pinned?'Unpin':'Pin'}</button>
    <button role="menuitem" data-act="rename">${SI.edit}Rename</button><hr>
    <button role="menuitem" class="danger" data-act="delete">${SI.trash}Delete</button>`;
  menu.hidden=false;
  const r = btn.getBoundingClientRect();
  menu.style.top = Math.min(r.bottom+4, innerHeight-menu.offsetHeight-8)+'px';
  menu.style.left = Math.max(8, r.right-menu.offsetWidth)+'px';
  btn.closest('.sess').classList.add('open');
  menu.querySelector('button').focus();
}
function commitRename(save){
  if(renamingId===null) return;
  const inp = $('#sessions .rename');
  const s = sessions.find(x=>x.id===renamingId);
  if(save && inp && inp.value.trim()) s.t = inp.value.trim();
  renamingId = null; renderSessions();
}

/* theme */
const root = document.documentElement;
function setTheme(t){ root.setAttribute('data-theme', t); try{localStorage.setItem('il-theme', t)}catch(e){} }
(function(){
  let t = null;
  try{ t = localStorage.getItem('il-theme') }catch(e){}
  if(!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  root.setAttribute('data-theme', t);
})();
$('#theme').addEventListener('click', ()=> setTheme(root.getAttribute('data-theme')==='dark' ? 'light' : 'dark'));

document.addEventListener('click', e=>{
  const dots = e.target.closest('[data-menu]');
  if(dots){
    const id = +dots.dataset.menu, wasOpen = !menu.hidden && +menu.dataset.sid===id;
    closeMenu(); if(!wasOpen) openMenu(dots,id); return;
  }
  const act = e.target.closest('[data-act]');
  if(act){
    const id = +menu.dataset.sid, a = act.dataset.act;
    closeMenu();
    if(a==='pin'){const s=sessions.find(x=>x.id===id);s.pinned=!s.pinned;renderSessions()}
    if(a==='rename'){renamingId=id;renderSessions()}
    if(a==='delete'){sessions.splice(sessions.findIndex(x=>x.id===id),1);renderSessions()}
    return;
  }
  if(!e.target.closest('.menu')) closeMenu();
  const pin = e.target.closest('[data-pin]');
  if(pin){const w=widgets.find(x=>x.id==pin.dataset.pin);w.pinned=!w.pinned;render();return}
  const rr = e.target.closest('[data-rerun]');
  if(rr && rr.dataset.state!=='running'){
    const old = rr.innerHTML; rr.dataset.state='running';
    rr.innerHTML = '<span class="spin">'+I.rerun+'</span>Running';
    setTimeout(()=>{rr.dataset.state='';rr.innerHTML=old},1600);
    return;
  }
  const se = e.target.closest('.sess');
  if(se){document.querySelectorAll('.sess').forEach(x=>x.removeAttribute('aria-current'));se.setAttribute('aria-current','true')}
  if(e.target.closest('a.open')) e.preventDefault();
});
document.addEventListener('keydown', e=>{
  if(e.key==='/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}
});
document.addEventListener('keydown', e=>{
  if(e.target.classList && e.target.classList.contains('rename')){
    if(e.key==='Enter') commitRename(true);
    if(e.key==='Escape') commitRename(false);
  } else if(e.key==='Escape') closeMenu();
});
document.addEventListener('focusout', e=>{
  if(e.target.classList && e.target.classList.contains('rename')) commitRename(true);
});
document.querySelector('aside').addEventListener('scroll', closeMenu);
$('#q').addEventListener('input', render);
$('#sq').addEventListener('input', renderSessions);

render(); renderSessions();
</script>
